name: Publish

on:
  push:
    branches:
      - develop
    tags:
      - "v*"

permissions:
  contents: read

# Serialize publishes per ref; never cancel an in-flight publish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit/ --cov=pikaia --cov-report=term-missing --cov-fail-under=95

  build:
    name: Build & Validate
    needs: test
    runs-on: ubuntu-latest
    outputs:
      index: ${{ steps.index.outputs.index }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Determine target index
        id: index
        run: |
          # Tag push (v*) -> production PyPI; branch push -> TestPyPI.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "index=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "index=testpypi" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to publish duplicate version
        run: uv run --no-project .github/scripts/check_pypi_version.py "${{ steps.index.outputs.index }}" pyproject.toml

      - name: Build package
        run: uv build

      - name: Validate distributions
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pikaia/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          verbose: true
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # A version tag (v*) is the release trigger. The "pypi" environment
    # enforces a manual approval gate (Settings -> Environments -> pypi)
    # before any upload to production PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/pikaia/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          print-hash: true
